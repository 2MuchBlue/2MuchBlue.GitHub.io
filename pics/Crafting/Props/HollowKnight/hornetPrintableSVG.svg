       id="text10"><tspan
         sodipodi:role="line"
         id="tspan10"
         style="font-size:10.5833px;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1"
         x="-108.60928"
         y="73.110718">Instructions</tspan></text>
    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:4.93889px;font-family:sans-serif;-inkscape-font-specification:sans-serif;text-align:start;writing-mode:lr-tb;direction:ltr;text-anchor:start;white-space:pre;inline-size:79.2403;display:inline;fill:#000000;fill-opacity:1;stroke:none;stroke-width:1;stroke-dasharray:none;stroke-opacity:1"
       x="28.748434"
       y="167.0517"
       id="text11"
       transform="translate(-136.49174,-87.072175)"><tspan
         x="28.748434"
         y="167.0517"
         id="tspan11">1) Put both eyes on one of the </tspan><tspan
         x="28.748434"
         y="173.22531"
         id="tspan22">head panels (this will be her </tspan><tspan
         x="28.748434"
         y="179.39892"
         id="tspan23">front face) around where they </tspan><tspan
         x="28.748434"
         y="185.57253"
         id="tspan24">apper on the head panel </tspan><tspan
         x="28.748434"
         y="191.74615"
         id="tspan25">pattern. I'd recommend taking </tspan><tspan
         x="28.748434"
         y="197.91976"
         id="tspan26">each eye down, then using a </tspan><tspan
         x="28.748434"
         y="204.09338"
         id="tspan27">satin stitch around the border </tspan><tspan
         x="28.748434"
         y="210.26699"
         id="tspan28">to make it look nice!
</tspan><tspan
         x="28.748434"
         y="216.44061"
         id="tspan29">
</tspan><tspan
         x="28.748434"
         y="222.61422"
         id="tspan30">2) sew 2 head pannels together </tspan><tspan
         x="28.748434"
         y="228.78784"
         id="tspan31">right sides together (RST)
</tspan><tspan
         x="28.748434"
         y="234.96145"
         id="tspan32">
</tspan><tspan
         x="28.748434"
         y="241.13506"
         id="tspan33">3) 2 body panels together sewn </tspan><tspan
         x="28.748434"
         y="247.30868"
         id="tspan34">RST.
</tspan><tspan
         x="28.748434"
         y="253.48229"
         id="tspan35">
</tspan><tspan
         x="28.748434"
         y="259.65591"
         id="tspan36">4) Attatch head to body (I use </tspan><tspan
         x="28.748434"
         y="265.82951"
         id="tspan37">a lot of ladder stitches by hand, </tspan><tspan
         x="28.748434"
         y="272.00312"
         id="tspan38">but most anything will work)</tspan></text>
